[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kalbot"
dynamic = ["version"]
description = "Completes unfinished Kalvium quizzes, written, coding and link assignments with an LLM (Gemini or Claude)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Khandelwal" }]
keywords = ["kalvium", "playwright", "automation", "llm", "gemini", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "playwright>=1.48",
    "google-genai>=1.0",
    "anthropic>=1.11",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
kalbot = "kalbot.cli:main"

[project.urls]
Repository = "https://github.com/gaurav-205/kalvium-quiz-automaion"

[tool.setuptools]
packages = ["kalbot"]

[tool.setuptools.package-data]
kalbot = ["dom.js", "defaults.yaml"]

[tool.setuptools.dynamic]
version = { attr = "kalbot.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF100"]
ignore = [
    "SIM105",  # contextlib.suppress reads worse than try/except/pass in short blocks
    "B023",    # closures over loop variables are evaluated immediately (poll callbacks)
]

[tool.ruff.lint.per-file-ignores]
"tests/mock_portal.py" = ["E501"]  # inline HTML/JS of the fake portal

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["e2e: drives a real browser against the local mock portal (slower)"]
